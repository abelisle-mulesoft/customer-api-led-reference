#===================================================================================================
# Mule Application Properties Template
#===================================================================================================

#---------------------------------------------------------------------------------------------------
# HTTP Listener Config (CloudHub 2.0)
# - Applications must listen on host 0.0.0.0; no need to override here.
# - CloudHub 2.0 injects the reserved property ${http.port}; it is defined here to support unit
#   testing outside of CloudHub 2.0 (e.g. Anypoint Studio).
http:
  port: "8081"

#---------------------------------------------------------------------------------------------------
# SAP Connector Configuration (SAP ECC Instance)
sap:
  host:           "<sap-host>"
  systemNumber:   "<sap-system-number>"
  client:         "<sap-client>"
  username:       "<sap-username>"

  # RFC Server Configuration (Inbound IDocs)
  gatewayHost:    "<sap-gateway-host>"
  gatewayService: "<sap-gateway-service>"
  programId:      "<sap-program-id>"

#---------------------------------------------------------------------------------------------------
# Customer Process API Smart Connector Configuration
customer_papi:
  # Hostname only (no protocol prefix or trailing slash).
  # Example: customer-papi-dev-34mjq8.goajj2-1.usa-w2.cloudhub.io
  host:           "<customer-papi-host>"
  port:           "443"
  protocol:       "HTTPS"
  base_path:      "/api"
  client_id:      "<client-id>"
