#===================================================================================================
# Mule Application Properties Template
#===================================================================================================

#---------------------------------------------------------------------------------------------------
# HTTP Listener Config (CloudHub 2.0)
# - Applications must listen on host 0.0.0.0; no need to override here.
# - CloudHub 2.0 injects the reserved property ${http.port}; it is defined here to support unit
#   testing outside of CloudHub 2.0 (e.g. Anypoint Studio).
http:
  port: "8081"

#---------------------------------------------------------------------------------------------------
# Salesforce Connector Configuration (OAuth 2.0 Client Credentials)
salesforce:
  brilm:
    token_url:    "<token-url>"                  # Salesforce OAuth 2.0 Token Endpoint URL
    consumer_key: "<external-app-consumer-key>"  # Salesforce External App Consumer Key (Client ID)

    integration_user_id: "<user-id>"             # Salesforce Integration User ID (CDC Loop Prevention)

#---------------------------------------------------------------------------------------------------
# Salesforce Brilliant Mule Customer System API Smart Connector Configuration
sf_brilm_customer_sapi:
  host:           "<hostname>"   # System API hostname
  port:           ""             # System API port (optional)
  protocol:       "HTTPS"        # HTTP or HTTPS
  base_path:      "/api"         # System API base path

#---------------------------------------------------------------------------------------------------
# Customer Process API Smart Connector Configuration
customer_papi:
  host:           "<hostname>"   # Process API hostname
  port:           ""             # Process API port (optional)
  protocol:       "HTTPS"        # HTTP or HTTPS
  base_path:      "/api"         # Process API base path

#---------------------------------------------------------------------------------------------------
# API Client Application Configuration
client:
  id:             "<client-id>"   # Registered Client Application ID
